<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  
</head>

<body>
  <app-root>
    <div id="initial-app-loader" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;">
      <div style="width:42px;height:42px;border:3.5px solid #f3e8ff;border-top-color:#a000e2;border-radius:50%;animation:initialSpin 0.75s cubic-bezier(0.68,-0.55,0.27,1.55) infinite;"></div>
      <p style="font-size:13px;font-weight:600;color:#64748b;margin:16px 0 0;letter-spacing:0.2px;">Starting Partner App...</p>
      <style>
        @keyframes initialSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
  </app-root>
  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA85HFedGjgP12MG_dvR-MVgooWTcJNIb0&libraries=marker,geometry,places,drawing&v=beta">
  </script>
</body>

</html>
